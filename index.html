<!-- qr-camera.html -->
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>QRコードリーダー（カメラ）</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
      color: #333;
      max-width: 640px;
      margin: 0 auto;
      padding: 10px;
      box-sizing: border-box;
    }

    h1 {
      font-size: 22px;
      margin: 10px 0;
    }

    #controls {
      margin-bottom: 10px;
    }

    #controls button {
      padding: 6px 12px;
      margin-right: 8px;
    }

    #loadingMessage {
      text-align: center;
      padding: 20px;
      background-color: #eee;
      border-radius: 8px;
      margin-bottom: 10px;
    }

    /* 表示用キャンバス（見た目用） */
    #canvas {
      width: 100%;
      border-radius: 8px;
      background: #000;
    }

    #output {
      margin-top: 16px;
      background: #eee;
      padding: 10px;
      border-radius: 8px;
    }

    #output div {
      padding-bottom: 6px;
      word-wrap: break-word;
    }

    .result-item {
      font-family: monospace;
      white-space: pre-wrap;
      padding: 4px 6px;
      margin-bottom: 4px;
      background: #fff;
      border-radius: 4px;
    }

    .result-item-index {
      font-weight: bold;
      margin-right: 4px;
    }

    .result-link {
      color: #0066cc;
      text-decoration: underline;
      word-break: break-all;
    }
  </style>
</head>

<body>
  <h1>QRコードリーダー（カメラ）</h1>

  <div id="controls">
    <button id="startButton">カメラ開始</button>
    <button id="stopButton" disabled>カメラ停止</button>
  </div>

  <p>
    カメラを開始して、画面にQRコードを映してください。<br>
    読み取られたQRコードは下のリストに<strong>一度だけ</strong>追加されます。<br>
    URL形式のものはクリック可能なリンクになります。
  </p>

  <div id="loadingMessage">
    カメラは停止中です。「カメラ開始」ボタンを押してください。
  </div>

  <canvas id="canvas" hidden></canvas>

  <div id="output" hidden>
    <div id="outputMessage">まだQRコードは検出されていません。</div>
    <div id="resultsContainer"></div>
  </div>

  <!-- jsQRライブラリ（CDN） -->
  <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>

  <script>
    const video = document.createElement("video");
    const displayCanvas = document.getElementById("canvas");       // 表示用
    const displayCtx = displayCanvas.getContext("2d");
    const loadingMessage = document.getElementById("loadingMessage");
    const outputContainer = document.getElementById("output");
    const outputMessage = document.getElementById("outputMessage");
    const resultsContainer = document.getElementById("resultsContainer");
    const startButton = document.getElementById("startButton");
    const stopButton = document.getElementById("stopButton");

    // 解析用の小さいキャンバス（ユーザーには見せない）
    const scanCanvas = document.createElement("canvas");
    const scanCtx = scanCanvas.getContext("2d", { willReadFrequently: true });
    const SCAN_WIDTH = 640;
    const SCAN_HEIGHT = 360;

    const seenCodes = new Set();
    let resultCount = 0;

    const STABLE_THRESHOLD = 3;
    let currentCandidate = null;
    let currentCandidateCount = 0;

    let stream = null;
    let running = false;
    let tickHandle = null;
    let frameCounter = 0; // フレーム間引き用

    function drawLine(begin, end, color) {
      displayCtx.beginPath();
      displayCtx.moveTo(begin.x, begin.y);
      displayCtx.lineTo(end.x, end.y);
      displayCtx.lineWidth = 4;
      displayCtx.strokeStyle = color;
      displayCtx.stroke();
    }

    function isUrlLike(text) {
      return /^https?:\/\/[^\s]+$/i.test(text.trim());
    }

    function addResult(codeText) {
      if (seenCodes.has(codeText)) return;

      seenCodes.add(codeText);
      resultCount++;

      if (resultCount === 1) {
        outputMessage.textContent = "検出されたQRコード一覧：";
      }

      const div = document.createElement("div");
      div.className = "result-item";

      const indexSpan = document.createElement("span");
      indexSpan.className = "result-item-index";
      indexSpan.textContent = "[" + resultCount + "]";

      const contentSpan = document.createElement("span");
      const trimmed = codeText.trim();

      if (isUrlLike(trimmed)) {
        const a = document.createElement("a");
        a.href = trimmed;
        a.textContent = trimmed;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.className = "result-link";
        contentSpan.appendChild(document.createTextNode(" "));
        contentSpan.appendChild(a);
      } else {
        contentSpan.textContent = " " + codeText;
      }

      div.appendChild(indexSpan);
      div.appendChild(contentSpan);
      resultsContainer.appendChild(div);
    }

    // 軽量なグレースケール＋コントラスト
    function enhanceSimple(imageData) {
      const data = imageData.data;
      const contrast = 1.5;
      const mid = 128;

      for (let i = 0; i < data.length; i += 4) {
        const r = data[i];
        const g = data[i + 1];
        const b = data[i + 2];

        let v = 0.299 * r + 0.587 * g + 0.114 * b;
        v = (v - mid) * contrast + mid;
        if (v < 0) v = 0;
        if (v > 255) v = 255;

        data[i] = data[i + 1] = data[i + 2] = v;
      }
      return imageData;
    }

    async function startCamera() {
      if (running) return;
      try {
        loadingMessage.innerText = "カメラを起動中です...";
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "environment",
            width:  { ideal: 1280 },
            height: { ideal: 720 },
            frameRate: { ideal: 30, max: 60 }
          }
        });

        video.srcObject = stream;
        video.setAttribute("playsinline", true);
        await video.play();

        running = true;
        startButton.disabled = true;
        stopButton.disabled = false;

        tickHandle = requestAnimationFrame(tick);
      } catch (err) {
        loadingMessage.innerText = "カメラにアクセスできません: " + err.message;
      }
    }

    function stopCamera() {
      if (!running) return;

      running = false;

      if (tickHandle !== null) {
        cancelAnimationFrame(tickHandle);
        tickHandle = null;
      }

      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        stream = null;
      }

      video.srcObject = null;

      loadingMessage.innerText = "カメラは停止中です。「カメラ開始」ボタンを押してください。";
      displayCanvas.hidden = true;
      outputContainer.hidden = false;

      startButton.disabled = false;
      stopButton.disabled = true;
    }

    function tick() {
      if (!running) return;

      loadingMessage.innerText = "Loading video...";
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        loadingMessage.hidden = false; // メッセージ自体は表示したままでもOK
        displayCanvas.hidden = false;
        outputContainer.hidden = false;

        // 表示キャンバスのサイズを動画に合わせる（見た目用）
        displayCanvas.width = video.videoWidth;
        displayCanvas.height = video.videoHeight;
        displayCtx.imageSmoothingEnabled = true;

        // 動画フレームをそのまま表示キャンバスに描画
        displayCtx.drawImage(video, 0, 0, displayCanvas.width, displayCanvas.height);

        // フレーム間引き：2フレームに1回だけ解析
        frameCounter++;
        if (frameCounter % 2 === 0) {
          tickHandle = requestAnimationFrame(tick);
          return;
        }

        // 解析用の小さいキャンバスに縮小描画（オリジナル→SCAN_WIDTH×SCAN_HEIGHT）
        scanCanvas.width = SCAN_WIDTH;
        scanCanvas.height = SCAN_HEIGHT;
        scanCtx.imageSmoothingEnabled = false;
        scanCtx.drawImage(video, 0, 0, SCAN_WIDTH, SCAN_HEIGHT);

        const scanImageData = scanCtx.getImageData(0, 0, SCAN_WIDTH, SCAN_HEIGHT);

        let code = null;

        // 1. 生画像で解析
        code = jsQR(scanImageData.data, SCAN_WIDTH, SCAN_HEIGHT, {
          inversionAttempts: "attemptBoth",
        });

        // 2. まだ見つからなければ簡易強調して再解析
        if (!code) {
          const enhanced = enhanceSimple(
            new ImageData(
              new Uint8ClampedArray(scanImageData.data),
              SCAN_WIDTH,
              SCAN_HEIGHT
            )
          );
          code = jsQR(enhanced.data, SCAN_WIDTH, SCAN_HEIGHT, {
            inversionAttempts: "attemptBoth",
          });
        }

        if (code) {
          // 解析キャンバス座標 → 表示キャンバス座標にスケールして枠線を描く
          const scaleX = displayCanvas.width / SCAN_WIDTH;
          const scaleY = displayCanvas.height / SCAN_HEIGHT;

          function mapPoint(p) {
            return {
              x: p.x * scaleX,
              y: p.y * scaleY,
            };
          }

          const loc = {
            topLeftCorner: mapPoint(code.location.topLeftCorner),
            topRightCorner: mapPoint(code.location.topRightCorner),
            bottomRightCorner: mapPoint(code.location.bottomRightCorner),
            bottomLeftCorner: mapPoint(code.location.bottomLeftCorner),
          };

          drawLine(loc.topLeftCorner, loc.topRightCorner, "#FF3B58");
          drawLine(loc.topRightCorner, loc.bottomRightCorner, "#FF3B58");
          drawLine(loc.bottomRightCorner, loc.bottomLeftCorner, "#FF3B58");
          drawLine(loc.bottomLeftCorner, loc.topLeftCorner, "#FF3B58");

          const text = code.data;

          if (text === currentCandidate) {
            currentCandidateCount++;
          } else {
            currentCandidate = text;
            currentCandidateCount = 1;
          }

          if (currentCandidateCount === STABLE_THRESHOLD) {
            addResult(text);
          }
        } else {
          currentCandidate = null;
          currentCandidateCount = 0;
        }
      }

      tickHandle = requestAnimationFrame(tick);
    }

    startButton.addEventListener("click", startCamera);
    stopButton.addEventListener("click", stopCamera);
  </script>
</body>
</html>
